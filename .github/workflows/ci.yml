name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  packages: write

jobs:
  build-test-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          python -m pytest -v

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint Helm Chart
        run: helm lint helm/acme-payments

      - name: Render Helm Templates (Dry Run)
        run: helm template test-release helm/acme-payments

      - name: Build Docker image
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/acme-payments:${{ github.sha }} .
          docker tag ghcr.io/${{ github.repository_owner }}/acme-payments:${{ github.sha }} ghcr.io/${{ github.repository_owner }}/acme-payments:latest

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "ghcr.io/${{ github.repository_owner }}/acme-payments:${{ github.sha }}"
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image to GHCR
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/acme-payments:${{ github.sha }}
          docker push ghcr.io/${{ github.repository_owner }}/acme-payments:latest

      - name: Deploy Helm Chart (Dry Run Validation)
        run: |
          helm upgrade --install acme-payments helm/acme-payments \
            --set image.tag=${{ github.sha }} \
            --dry-run
